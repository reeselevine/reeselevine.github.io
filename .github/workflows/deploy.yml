name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "src/**"
      - "news/**"
      - "publications/**"
      - "**/*.html"
      - "**/*.css"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.md"
      - "**/*.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - ".github/workflows/deploy.yml"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - "assets/**"
      - "src/**"
      - "news/**"
      - "publications/**"
      - "**/*.html"
      - "**/*.css"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.md"
      - "**/*.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - ".github/workflows/deploy.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
